# Temporary public link (Cloudflare Quick Tunnel) — no account, domain, or open port.
# Usage: make tunnel-up && make tunnel-url. The URL changes whenever the tunnel restarts.
services:
  tunnel:
    image: cloudflare/cloudflared:latest
    command: ["tunnel", "--no-autoupdate", "--url", "http://caddy:80"]
    restart: unless-stopped
    depends_on:
      - caddy

  # The tunnel reaches caddy over the compose network, so in tunnel mode caddy
  # needs no public listener: bind 80 to loopback only and drop 443.
  caddy:
    ports: !override
      - "127.0.0.1:80:80"
