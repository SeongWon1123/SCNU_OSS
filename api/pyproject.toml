[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repodoc-api"
version = "0.1.0"
description = "repodoc API + worker (Phase 0-a skeleton)"
requires-python = ">=3.12"
# 직접 의존성은 == 고정(CI 재현성 — 로컬 초록·CI 빨강 드리프트 방지).
# 갱신 절차: 이미지 리빌드 후 `pip freeze` 실측값을 그대로 옮긴다.
dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.52.4",
    "sqlalchemy==2.0.52",
    "alembic==1.19.2",
    "pydantic-settings==2.15.0",
    "psycopg[binary]==3.3.5",
    "openai==3.8.0",  # §7.1 LLM 해설·요약 — OpenAI SDK 필수(OpenRouter 경유, PR계약 ④)
    "jinja2==3.1.6",  # §7.4 방침/고지 템플릿(.j2) 렌더링(PR계약 ④)
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.6",
    "respx==0.23.1",
    "httpx==0.28.1",
]

[tool.setuptools.packages.find]
include = ["app*", "worker*"]

[tool.setuptools.package-data]
"worker" = ["templates/*.j2"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
