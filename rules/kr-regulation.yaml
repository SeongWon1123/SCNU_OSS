# 리포닥 한국 규제 룰셋 v1.0 (동결) — semgrep 형식
# 소유: 팀원 B (사람만 수정). 에이전트 수정 금지. 변경 시 sample/positive·sample/negative 회귀 테스트 필수.
# 원칙: 룰은 "신호"를 잡는다. "의무 확정"은 하지 않는다. 수치(금액·형량)는 어디에도 쓰지 않는다.
rules:
  # ================= R1 위치기반서비스사업 신고 =================
  - id: kr-r1-browser-geolocation
    languages: [javascript, typescript]
    severity: WARNING
    message: "브라우저 위치정보(navigator.geolocation)를 수집합니다. 좌표를 서버로 전송·저장하면 위치기반서비스사업 신고 대상일 수 있습니다(서버 전송 여부 확인 필요)."
    patterns:
      - pattern-either:
          - pattern: navigator.geolocation.getCurrentPosition(...)
          - pattern: navigator.geolocation.watchPosition(...)
    metadata:
      rule: R1
      confidence: medium
      weight: 8

  - id: kr-r1-geo-column
    languages: [generic]
    severity: WARNING
    message: "위도·경도 컬럼 정의가 있습니다. 개인 위치정보를 서버에 저장하는 것으로 보이며, 브라우저 위치 수집 신호와 함께 잡히면 신고 대상 가능성이 높습니다."
    paths:
      include: ["*.sql", "*.prisma", "**/models*.py", "**/models/**", "**/migrations/**", "**/schema*.ts", "**/entities/**", "**/*.entity.ts"]
    pattern-regex: (?is)\b(latitude|lat)\b.{0,200}\b(longitude|lng|lon)\b
    metadata:
      rule: R1
      confidence: medium
      weight: 4

  # ================= R2 개인정보처리방침 =================
  - id: kr-r2-pii-schema
    languages: [generic]
    severity: WARNING
    message: "스키마·모델에 개인정보 항목(이메일·전화번호·이름·생년월일 등)이 있습니다. 개인정보처리방침 공개(개인정보보호법 제30조)와 적법한 처리 근거(제15조: 동의 또는 계약 이행 등)가 필요합니다."
    paths:
      include: ["*.sql", "*.prisma", "**/models*.py", "**/models/**", "**/migrations/**", "**/schema*.ts", "**/entities/**", "**/*.entity.ts"]
    pattern-regex: (?i)\b(email|e_mail|phone|phone_number|phone_no|birth(date|day)?|full_name|real_name|address)\b\s*[:=(]?\s*(String|Column|CharField|EmailField|VARCHAR|TEXT|varchar|text|string|=|:)
    metadata:
      rule: R2
      confidence: high
      weight: 10

  - id: kr-r2-pii-hint
    languages: [generic]
    severity: INFO
    message: "개인정보로 보이는 필드명이 코드에 있습니다(참고). 스키마 신호와 함께 잡힐 때만 의미가 있습니다."
    paths:
      include: ["*.py", "*.ts", "*.tsx", "*.js", "*.jsx", "*.java", "*.kt", "*.go"]
      exclude: ["**/models*.py", "**/models/**", "**/migrations/**", "**/schema*.ts", "**/entities/**", "**/test*/**", "**/*.test.*", "**/*.spec.*", "**/fixtures/**"]
    pattern-regex: (?i)\b(phone_number|phoneNumber|birth_date|birthDate|real_name|realName)\b\s*[:=]
    metadata:
      rule: R2
      confidence: low
      weight: 2

  - id: kr-r2-analytics-sdk
    languages: [javascript, typescript]
    severity: INFO
    message: "애널리틱스·추적 SDK를 초기화합니다. 쿠키·행태정보 수집 사실을 개인정보처리방침에 기재해야 합니다."
    pattern-either:
      - pattern: gtag('config', ...)
      - pattern: ReactGA.initialize(...)
      - pattern: mixpanel.init(...)
      - pattern: amplitude.init(...)
      - pattern: posthog.init(...)
    metadata:
      rule: R2
      confidence: high
      weight: 3

  # ================= R3 통신판매업 신고 =================
  - id: kr-r3-payment-sdk-js
    languages: [javascript, typescript]
    severity: WARNING
    message: "결제 SDK를 사용합니다. 온라인으로 재화·용역을 반복 판매하면 통신판매업 신고 대상입니다(신고 면제 기준 고시 확인: 직전연도 거래 50회 미만 또는 간이과세자)."
    pattern-either:
      - pattern: loadTossPayments(...)
      - pattern: IMP.request_pay(...)
      - pattern: IMP.init(...)
      - pattern: PortOne.requestPayment(...)
      - pattern: loadStripe(...)
      - pattern: $S.checkout.sessions.create(...)
      - pattern: $S.paymentIntents.create(...)
    metadata:
      rule: R3
      confidence: high
      weight: 8

  - id: kr-r3-payment-sdk-python
    languages: [python]
    severity: WARNING
    message: "결제 API를 호출합니다. 통신판매업 신고 대상 여부를 확인하세요."
    pattern-either:
      - pattern: stripe.checkout.Session.create(...)
      - pattern: stripe.PaymentIntent.create(...)
      - pattern: requests.post("https://api.tosspayments.com/...", ...)
      - pattern: requests.post("https://api.iamport.kr/...", ...)
      - pattern: requests.post("https://api.portone.io/...", ...)
    metadata:
      rule: R3
      confidence: high
      weight: 8

  # ================= R5 광고성 정보 전송 =================
  - id: kr-r5-bulk-messaging
    languages: [javascript, typescript, python]
    severity: INFO
    message: "메일·SMS 발송 코드가 있습니다. 광고성 정보를 보내면 사전 수신동의와 수신거부 안내(정보통신망법 제50조)가 필요합니다."
    pattern-either:
      - pattern: nodemailer.createTransport(...)
      - pattern: $T.sendMail(...)
      - pattern: $SES.sendEmail(...)
      - pattern: $SES.send_email(...)
      - pattern: smtplib.SMTP(...)
      - pattern: resend.emails.send(...)
      - pattern: sgMail.send(...)
    metadata:
      rule: R5
      confidence: medium
      weight: 4

  # ================= R6 생성형 AI 표시·고지 =================
  - id: kr-r6-genai-api
    languages: [javascript, typescript, python]
    severity: WARNING
    message: "생성형 AI API를 호출합니다. 외부 API로 AI 기능을 제공하는 서비스도 AI 산출물 표시·이용자 고지 대상이 될 수 있습니다(인공지능 기본법 제31조, 2026.1.22 시행)."
    pattern-either:
      - pattern: $C.chat.completions.create(...)
      - pattern: $C.responses.create(...)
      - pattern: $C.images.generate(...)
      - pattern: new OpenAI(...)
      - pattern: new Anthropic(...)
      - pattern: OpenAI(...)
      - pattern: Anthropic(...)
      - pattern: genai.GenerativeModel(...)
      - pattern: new GoogleGenerativeAI(...)
      - pattern: new GoogleGenAI(...)
    metadata:
      rule: R6
      confidence: high
      weight: 8

  # ================= R7 주민등록번호 등 고유식별정보 =================
  - id: kr-r7-rrn-keyword
    languages: [generic]
    severity: WARNING
    message: "주민등록번호로 보이는 필드·변수명이 있습니다. 법령 근거 없이 주민등록번호를 수집·저장할 수 없습니다(개인정보보호법 제24조의2). 본인확인기관 CI/DI 등 대체수단을 검토하세요."
    paths:
      include: ["*.sql", "*.prisma", "*.py", "*.ts", "*.tsx", "*.js", "*.jsx", "*.java", "*.kt", "*.go"]
      exclude: ["**/test*/**", "**/*.test.*", "**/*.spec.*", "**/fixtures/**"]
    pattern-regex: (?i)\b(jumin|jumin_?no|resident_?(registration_?)?number|rrn_?no|주민(등록)?번호)\b
    metadata:
      rule: R7
      confidence: medium
      weight: 8

  - id: kr-r7-rrn-literal
    languages: [generic]
    severity: ERROR
    message: "주민등록번호 형식의 실제 값으로 보이는 문자열이 코드에 있습니다. 즉시 제거하고 저장 경로를 점검하세요(개인정보보호법 제24조의2)."
    paths:
      include: ["*.sql", "*.prisma", "*.py", "*.ts", "*.tsx", "*.js", "*.jsx", "*.java", "*.kt", "*.go", "*.json", "*.csv"]
      exclude: ["**/test*/**", "**/*.test.*", "**/*.spec.*", "**/fixtures/**"]
    pattern-regex: (?<!\d)\d{2}(0[1-9]|1[0-2])(0[1-9]|[12]\d|3[01])-[1-4]\d{6}(?!\d)
    metadata:
      rule: R7
      confidence: high
      weight: 15
