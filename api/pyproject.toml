[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repodoc-api"
version = "0.1.0"
description = "repodoc API + worker (Phase 0-a skeleton)"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "sqlalchemy>=2",
    "alembic",
    "pydantic-settings",
    "psycopg[binary]",
    "openai",  # §7.1 LLM 해설·요약 — OpenAI SDK 필수(OpenRouter 경유, PR계약 ④)
    "jinja2",  # §7.4 방침/고지 템플릿(.j2) 렌더링(PR계약 ④)
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "respx",
    "httpx",
]

[tool.setuptools.packages.find]
include = ["app*", "worker*"]

[tool.setuptools.package-data]
"worker" = ["templates/*.j2"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
